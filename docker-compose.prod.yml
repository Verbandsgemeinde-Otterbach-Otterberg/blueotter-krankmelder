# Production run with a prebuilt image (e.g. transferred via docker save/load):
#   docker compose -f docker-compose.prod.yml up -d
services:
  krankmelder:
    image: blueotter-krankmelder:latest
    pull_policy: never
    container_name: blueotter-krankmelder
    restart: unless-stopped
    init: true
    env_file:
      - .env.local
    ports:
      # Only reachable locally; put a TLS reverse proxy in front (admin login requires HTTPS).
      - "127.0.0.1:3000:3000"
    volumes:
      - krankmelder-data:/app/data
      - krankmelder-uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Healthcheck is defined in the Dockerfile (GET /api/public-settings).

volumes:
  krankmelder-data:
  krankmelder-uploads:
