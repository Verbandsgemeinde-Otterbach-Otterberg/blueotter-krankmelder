# Local build & run: docker compose up -d --build
services:
  krankmelder:
    image: blueotter-krankmelder:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blueotter-krankmelder
    restart: unless-stopped
    init: true
    env_file:
      - .env.local
    ports:
      # Only reachable locally; put a TLS reverse proxy in front (admin login requires HTTPS).
      - "127.0.0.1:3000:3000"
    volumes:
      - krankmelder-data:/app/data
      - krankmelder-uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  krankmelder-data:
  krankmelder-uploads:
