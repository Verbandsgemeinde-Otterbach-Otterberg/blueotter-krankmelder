services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blueotter-krankmelder
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ./data/krankmeldungen.db
      UPLOAD_DIR: ./uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
